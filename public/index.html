<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a211b" />
    <title>Poker Bank · Your table, together</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/"
        >♠ <span>POKER BANK<small>REAL CARDS. SHARED CHIPS.</small></span></a
      >
      <div id="connection" role="status">Your next home game</div>
    </header>
    <main id="app"></main>
    <div id="toast" role="alert" hidden></div>
    <dialog id="share">
      <button id="close-share" class="close" aria-label="Close">×</button>
      <p class="eyebrow">PULL UP A CHAIR</p>
      <h2>One table. Every phone.</h2>
      <img id="qr" alt="QR code to join this table" width="220" height="220" />
      <p id="share-code" class="code"></p>
      <p>Scan or share this link. The host approves every seat.</p>
      <input id="share-link" readonly aria-label="Table invite link" /><button
        id="copy-link"
      >
        Copy invite link
      </button>
    </dialog>
  </body>
</html>
