[package]
name = "poker-bank"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3.32"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
uuid = { version = "1.21.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.25.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
